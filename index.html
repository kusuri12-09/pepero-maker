.preview canvas { display: none; }
.package-preview { position: absolute; left: -6px; top: 32px; width: 292px; height: 292px; z-index: 1; background: center / contain no-repeat; filter: drop-shadow(0 3px 4px #71502b20); }
.pepero-scene::before { z-index: 0; }
.pepero-stick { z-index: 2; }
.sheet {
  flex-shrink: 0;
  margin: 16px 14px max(22px, env(safe-area-inset-bottom));
  padding: 26px 20px 28px;
  background: #fff9ed;
  border: 1px solid #e7d9bf;
  border-radius: 26px;
  box-shadow: inset 0 0 0 5px #faf0dd, 0 4px 0 #d8c4a2, 0 12px 24px #704a4014;
  color: #57463b;
}
.tray-controls .back-button { background: #fff9ed; border: 1px solid #e7d9bf; color: #786556; box-shadow: none; }
.tray-controls .back-button:hover { background: #f7d2c7; border-color: #f0c8bd; color: #964b3f; }
.sheet h2 { text-align: left; font-size: 22px; line-height: 31px; }
h2 { margin: 0 0 24px; font-size: 24px; line-height: 34px; font-weight: 700; letter-spacing: -.5px; }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.choices[data-columns="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.choices[data-columns="1"] { grid-template-columns: 1fr; gap: 10px; }
button {
  appearance: none;
  display: grid;
  justify-items: center;
  align-content: center;
  min-width: 0;
  min-height: 104px;
  gap: 14px;
  padding: 16px 8px;
  border: 2px solid transparent;
  border-radius: 18px;
  background: #f5ecdc;
  color: #6c5848;
  box-shadow: inset 0 1px 0 #fffaf0;
  font: inherit;
  font-size: 15px;
  line-height: 22.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, transform .15s;
  -webkit-tap-highlight-color: transparent;
}
button:hover { background: #f0e4cf; color: #6c5848; }
button[aria-pressed="true"] { background: #fff0e6; border-color: var(--brand-primary); box-shadow: none; color: #964b3f; }
button:active { transform: scale(.98); }
button:focus-visible { outline: 3px solid var(--brand-primary); outline-offset: 3px; }
button:disabled { opacity: .45; cursor: wait; }
button span { display: inline-grid; place-items: center; font-size: 28px; line-height: 30px; color: inherit; }
button[data-kind="biscuit"] .option-icon::before { content: ""; width: 12px; height: 32px; border-radius: 5px; background: var(--sample); box-shadow: inset -3px 0 #704a4014; transform: rotate(22deg); }
button[data-kind="chocolate"] span { width: 30px; height: 30px; border-radius: 5px; background: linear-gradient(90deg,transparent 46%,#98664944 46% 53%,transparent 53%),linear-gradient(transparent 46%,#98664944 46% 53%,transparent 53%),var(--sample); box-shadow: inset 2px 2px #ffffff44; transform: rotate(-9deg); }
.choices[data-columns="1"] button { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 14px 20px; font-size: 17px; line-height: 25.5px; }
.choices[data-columns="1"] button:first-child { background: var(--brand-primary); color: #40231f; }
.choices[data-columns="1"] button:first-child:hover { background: var(--brand-hover); }
.choices[data-columns="1"] button:nth-child(2) { background: #f5ecdc; color: #6c5848; }
.choices[data-columns="1"] button:last-child { background: transparent; border-color: transparent; box-shadow: none; color: #786556; }
.choices[data-columns="1"] button span { font-size: 20px; line-height: 24px; }
.feedback { margin: 16px 0 0; color: var(--tds-grey700); font-size: 15px; line-height: 22.5px; }
.share-link { width: 100%; margin-top: 12px; padding: 16px; border: 1px solid var(--tds-grey200); border-radius: 12px; background: var(--tds-grey50); color: var(--tds-grey900); font: inherit; font-size: 16px; }
.share-link:focus-visible { outline: 2px solid var(--brand-primary); }
[hidden] { display: none !important; }
.phone:not(.is-complete) .sheet { height: 240px; display: flex; flex-direction: column; }
.phone:not(.is-complete) .choices { flex: 1; min-height: 0; grid-auto-rows: 104px; align-content: start; }
.choices[data-step="2"] { overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: thin; scrollbar-color: #e9b5a6 transparent; padding: 3px; scroll-padding: 3px; }

  .phone:not(.is-complete) .choices { grid-auto-rows: 76px; }
  .sheet { margin: 10px 14px max(14px, env(safe-area-inset-bottom)); padding: 18px 18px 20px; }
  h2 { margin-bottom: 14px; }
  .back-button { margin-bottom: 10px; }
  button { min-height: 76px; gap: 8px; padding: 10px 6px; }
  .choices { gap: 8px; }
  .choices[data-columns="1"] { gap: 6px; }
  .choices[data-columns="1"] button { min-height: 44px; padding: 8px 12px; }
}
@media (max-height: 500px) and (min-width: 520px) {
  .phone:not(.is-complete) .sheet { height: 172px; }
  .phone:not(.is-complete) .choices { grid-auto-rows: 64px; }
  .phone { width: min(100%, 760px); flex-direction: row; align-items: stretch; }
  .selection-area { width: 56%; align-self: end; }
  .sheet { margin: 8px 14px 14px; padding: 12px 16px; }
  .sheet h2 { font-size: 20px; line-height: 26px; margin-bottom: 10px; }
  .back-button { min-height: 36px; margin-bottom: 6px; padding: 4px 10px; }
  button { min-height: 64px; gap: 4px; padding: 6px; }
  .choices[data-columns="1"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.selection-area { flex-shrink: 0; }
.tray-controls { position: relative; display: flex; align-items: center; min-height: 44px; margin: 0 14px; }
.tray-controls .back-button { margin: 0; width: 36px; height: 36px; min-height: 36px; padding: 0; border-radius: 50%; }
.tray-toggle { position: absolute; left: 50%; top: 12px; z-index: 1; translate: -50% 0; display: grid; place-items: center; width: 44px; height: 44px; min-height: 44px; padding: 0; border: 0; background: transparent; box-shadow: none; color: #964b3f; }
.tray-toggle:hover { background: transparent; color: #78382e; }
.tray-toggle span { width: 16px; height: 16px; display: grid; place-items: center; }
.tray-toggle span::before { content: ""; width: 9px; height: 9px; border-bottom: 2px solid currentColor; border-right: 2px solid currentColor; transform: rotate(45deg); transition: transform 360ms ease; }
.tray-region { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 420ms cubic-bezier(.22,1,.36,1); }
.tray-clip { min-height: 0; overflow: hidden; }
.tray-region .sheet { transition: transform 420ms cubic-bezier(.22,1,.36,1), opacity 300ms ease; }
.selection-area.is-collapsed .tray-region { grid-template-rows: 0fr; }
.selection-area.is-collapsed .sheet { transform: translateY(40px); opacity: 0; }
.selection-area.is-collapsed .tray-toggle span::before { transform: rotate(225deg); }
.selection-area.is-collapsed { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
